   une scène de papier quadrillé (1 carreau = 1 cm), une carte d'explication et les commandes. */
:root{
  --desk:#dde4ea; --paper:#fdfdfb; --grid:#d5e0ec;
  --ink:#1d2733; --muted:#566272; --line:#c3ceda;

  --f-math:"Newsreader","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#12171c; --paper:#232b33; --grid:#2d3843;
  --ink:#e8edf2; --muted:#9aa8b6; --line:#35414d;
  --accent:#ff6b4f; --circle:#4fd1a1; --construct:#6fb0f0; --orange:#f0a03c; --violet:#a98bf5;
  --card:#1a2027; --chip:#252e37; --chip-on:#e8edf2; --chip-on-fg:#12171c; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#12171c; --paper:#232b33; --grid:#2d3843;
  --ink:#e8edf2; --muted:#9aa8b6; --line:#35414d;
  --accent:#ff6b4f; --circle:#4fd1a1; --construct:#6fb0f0; --orange:#f0a03c; --violet:#a98bf5;
  --card:#1a2027; --chip:#252e37; --chip-on:#e8edf2; --chip-on-fg:#12171c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.1;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.stage{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper);box-shadow:0 10px 30px rgba(10,20,30,.14)}
.stage svg{display:block;width:100%;height:auto}
.panel{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.panel>.card:first-child{min-height:280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.badge{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card h2{font-family:var(--f-display);font-size:1.3rem;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.card p{margin:0 0 8px}
.gesture{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:500}
.gesture::before{content:"";flex:none;width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--accent)}
.ctrl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.main{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on);min-width:7.5rem}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--construct);outline-offset:2px}

.chip{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:0}
.chip b{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:.8rem}
.chip.on{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.chip.on b{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}
.speed{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
select{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
@media (max-width:720px){.panel{grid-template-columns:minmax(0,1fr)}}

.sk{stroke:var(--ink)}.sm{stroke:var(--muted)}.sa{stroke:var(--accent)}.sc{stroke:var(--construct)}.sg{stroke:var(--circle)}.ds{stroke-dasharray:8 7}
.fc{fill:var(--construct);fill-opacity:.16;stroke:none}.fa{fill:var(--accent);fill-opacity:.22}
.dot{fill:var(--accent)}
.lbl{font-family:var(--f-math);font-style:italic;font-weight:500;font-size:28px;fill:var(--ink)}
.eq{font-family:var(--f-math);font-size:31px;fill:var(--ink)}.eq.r{fill:var(--accent);font-weight:600}
.hd{font-family:var(--f-display);font-size:27px;font-weight:700;fill:var(--ink)}
.note{font-family:var(--f-body);font-size:23px;fill:var(--muted)}
.big{font-family:var(--f-math);font-size:48px;fill:var(--ink)}
.tag{font-family:var(--f-display);font-size:22px;font-weight:700}
.num{font-family:var(--f-display);font-size:18px;font-weight:700;fill:#fff}
.mot{font-family:var(--f-display);font-size:21px;font-weight:600}
.ta{fill:var(--accent)}.tc{fill:var(--construct)}.tg{fill:var(--circle)}

 draw:function(q){

    var pts=[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]],left=2*(w+h)*ease(F(a,.1,.75)),path="M"+x+" "+y,tip=[x,y];

    for(k=1;k<6;k++)L(x+k*u,y,x+k*u,y+h,"th sc",F(b,.3,.7));for(k=1;k<4;k++)L(x,y+k*u,x+w,y+k*u,"th sc",F(b,.3,.7));

/* Le déroulé : chaque partie est une suite de gestes ; le temps dit où l'on en est. */
var START=[],total=0;
STEPS.forEach(function(s){START.push(total);s.dur=s.acts.reduce(function(a,b){return a+b[0]},0);total+=s.dur});
function locate(t){t=clamp(t,0,total);var i=STEPS.length-1;while(i>0&&START[i]>t)i--;var s=STEPS[i],l=t-START[i],a=0;
  while(a<s.acts.length-1&&l>=s.acts[a][0]){l-=s.acts[a][0];a++}return {i:i,a:a,p:clamp(l/s.acts[a][0],0,1)}}
var shown=-1,shownAct=-1;
function render(t){var w=locate(t),s=STEPS[w.i];
  while(G.firstChild)G.removeChild(G.firstChild);
  s.draw(function(k){return k<w.a?1:k>w.a?0:w.p});
  if(w.i!==shown){shown=w.i;shownAct=-1;$("badge").textContent=s.badge;$("title").textContent=s.title;$("text").textContent=s.text;
    [].forEach.call($("chips").children,function(c,j){c.classList.toggle("on",j===w.i);c.setAttribute("aria-current",j===w.i?"step":"false")})}
  if(w.a!==shownAct){shownAct=w.a;$("gesture").textContent=s.acts[w.a][1]}
  $("seek").value=Math.round(1000*t/total)}

STEPS.forEach(function(s,i){var b=document.createElement("button");b.type="button";b.className="chip";
  b.innerHTML="<b>"+(i+1)+"</b><span></span>";b.lastChild.textContent=s.chip;
  b.onclick=function(){time=START[i];setPlaying(true)};$("chips").appendChild(b)});

var time=0,last=0,playing=true,speed=1;
function setPlaying(v){playing=v;$("play").textContent=v?"Pause":"Lecture"}
$("play").onclick=function(){if(!playing&&time>=total)time=0;setPlaying(!playing)};
$("restart").onclick=function(){time=0;setPlaying(true)};
$("seek").oninput=function(){time=this.value/1000*total;render(time)};
$("speed").onchange=function(){speed=parseFloat(this.value)};
function frame(ts){if(playing){time+=(ts-last)*speed;if(time>=total){time=total;setPlaying(false)}}last=ts;render(time);requestAnimationFrame(frame)}
requestAnimationFrame(function(ts){last=ts;frame(ts)});
})();
