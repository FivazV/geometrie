<style>
/* Grandeurs et mesures — le triangle (27.11.2026). Même mise en page que les notions initiales :

:root{
  --desk:#dde4ea; --paper:#fdfdfb; --grid:#d5e0ec;

  --card:#f3f6f9; --chip:#e6ecf2; --chip-on:#1d2733; --chip-on-fg:#ffffff;

  --f-math:"Newsreader","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#12171c; --paper:#232b33; --grid:#2d3843;
  --ink:#e8edf2; --muted:#9aa8b6; --line:#35414d;
  --accent:#ff6b4f; --circle:#4fd1a1; --construct:#6fb0f0; --orange:#f0a03c; --violet:#a98bf5;
  --card:#1a2027; --chip:#252e37; --chip-on:#e8edf2; --chip-on-fg:#12171c; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#12171c; --paper:#232b33; --grid:#2d3843;
  --ink:#e8edf2; --muted:#9aa8b6; --line:#35414d;
  --accent:#ff6b4f; --circle:#4fd1a1; --construct:#6fb0f0; --orange:#f0a03c; --violet:#a98bf5;
  --card:#1a2027; --chip:#252e37; --chip-on:#e8edf2; --chip-on-fg:#12171c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.1;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.stage{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper);box-shadow:0 10px 30px rgba(10,20,30,.14)}
.stage svg{display:block;width:100%;height:auto}
.panel{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.panel>.card:first-child{min-height:280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.badge{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.card p{margin:0 0 8px}
.gesture{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:500}
.gesture::before{content:"";flex:none;width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--accent)}
.ctrl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;color:var(--ink)}

.btn:focus-visible,.chip:focus-visible,select:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--construct);outline-offset:2px}

@media (max-width:720px){.panel{grid-template-columns:minmax(0,1fr)}}
/* La scène */
.pl,.x,.th{fill:none;stroke-linecap:round;stroke-linejoin:round}.pl{stroke-width:3.4}.x{stroke-width:2.4}.th{stroke-width:1.2}
.sk{stroke:var(--ink)}.sm{stroke:var(--muted)}.sa{stroke:var(--accent)}.sc{stroke:var(--construct)}.sg{stroke:var(--circle)}.so{stroke:var(--orange)}.ds{stroke-dasharray:8 7}
.fc{fill:var(--construct);fill-opacity:.16;stroke:none}.fo{fill:var(--orange);fill-opacity:.32;stroke:none}.fg{fill:var(--circle);fill-opacity:.14;stroke:none}.fa{fill:var(--accent);fill-opacity:.22}
.dot{fill:var(--accent)}
.lbl{font-family:var(--f-math);font-style:italic;font-weight:500;font-size:28px;fill:var(--ink)}
.eq{font-family:var(--f-math);font-size:31px;fill:var(--ink)}.eq.r{fill:var(--accent);font-weight:600}
.hd{font-family:var(--f-display);font-size:27px;font-weight:700;fill:var(--ink)}
.note{font-family:var(--f-body);font-size:23px;fill:var(--muted)}
.big{font-family:var(--f-math);font-size:42px;fill:var(--ink)}
.tag{font-family:var(--f-display);font-size:32px;font-weight:700}
#g text{white-space:pre}
.ta{fill:var(--accent)}.tc{fill:var(--construct)}.tg{fill:var(--circle)}.to{fill:var(--orange)}

<div class="wrap">
  <header>
    <h1>Triangle – aire et périmètre</h1>
    <p class="sub">Le tour du triangle, puis son aire : pourquoi on divise par 2, et pourquoi la formule marche pour tous les triangles. Tu peux mettre en pause, avancer à la main ou choisir une partie.</p>
  </header>

  <div class="stage">
  <svg id="scene" viewBox="0 0 900 600" role="img" aria-label="Animation : périmètre et aire du triangle, démontrée à partir du rectangle.">
    <defs>
      <pattern id="g1" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" style="stroke:var(--grid)" stroke-width="1"/></pattern>
    </defs>
    <rect width="900" height="600" style="fill:var(--paper)"/>
    <rect width="900" height="600" fill="url(#g1)"/>
    <g id="g"></g>
  </svg>
  </div>

  <div class="panel">
    <section class="card" aria-live="polite">
      <div class="badge" id="badge"></div>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="gesture" id="gesture"></div>
    </section>

    <section class="card ctrl" aria-label="Commandes">
      <div class="row">
        <button class="btn main" id="play" type="button">Pause</button>
        <button class="btn" id="restart" type="button">Recommencer</button>
      </div>
      <label class="speed" for="seek">Avancer à la main
        <input id="seek" type="range" min="0" max="1000" value="0" step="1">
      </label>
      <div class="chips" id="chips"></div>
      <div class="speed"><label for="speed">Vitesse</label>
        <select id="speed"><option value="0.6">Lente</option><option value="1" selected>Normale</option><option value="1.5">Rapide</option></select>
      </div>
    </section>
  </div>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var NS="http://www.w3.org/2000/svg",G=$("g");
function clamp(x,a,b){return Math.min(b,Math.max(a,x))}
function ease(f){return f<.5?4*f*f*f:1-Math.pow(-2*f+2,3)/2}
function F(p,a,b){return clamp((p-a)/(b-a),0,1)}
function el(tag,at,txt,parent){var e=document.createElementNS(NS,tag);for(var k in at)if(at[k]!=null)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;(parent||G).appendChild(e);return e}
function T(x,y,txt,cls,op,anc,style){return el("text",{x:x,y:y,"class":cls,"text-anchor":anc||"start",opacity:op,style:style},txt)}
/* Un texte en morceaux : [texte, classe, attributs]. */
function TS(x,y,parts,cls,op,anc){var e=T(x,y,null,cls,op,anc);parts.forEach(function(p){var a=p[2]||{};a["class"]=p[1]||null;el("tspan",a,p[0],e)});return e}
/* Une expression avec de vraies fractions (barre horizontale) : chaque morceau est soit une suite de [texte, classe],
   soit {n: numérateur, d: dénominateur}. y est la ligne d'écriture ; la barre passe à mi-hauteur des chiffres. */
function FR(x,y,items,cls,op,anc){if(op<=0)return;var g=el("g",{opacity:op}),cx=0,fs=0;
  function fill(t,parts){parts.forEach(function(p){var a={};for(var k in (p[2]||{}))a[k]=p[2][k];a["class"]=p[1]||null;el("tspan",a,p[0],t)})}
  items.forEach(function(it){
    if(Array.isArray(it)){var t=el("text",{x:cx,y:0,"class":cls},null,g);fill(t,it);fs=fs||parseFloat(getComputedStyle(t).fontSize);cx+=t.getComputedTextLength()}
    else{var n=el("text",{y:0,"class":cls,"text-anchor":"middle"},null,g),d=el("text",{y:0,"class":cls,"text-anchor":"middle"},null,g);fill(n,it.n);fill(d,it.d);
      fs=fs||parseFloat(getComputedStyle(n).fontSize);var w=Math.max(n.getComputedTextLength(),d.getComputedTextLength())+fs*.35,m=cx+w/2,ax=-fs*.3;
      n.setAttribute("x",m);n.setAttribute("y",ax-fs*.2);d.setAttribute("x",m);d.setAttribute("y",ax+fs*.9);
      el("path",{d:"M"+(cx+fs*.1)+" "+ax+"H"+(cx+w-fs*.1),style:"fill:none;stroke-linecap:round;stroke:"+getComputedStyle(n).fill+";stroke-width:"+Math.max(1.6,fs*.06)},null,g);cx+=w}});
  g.setAttribute("transform","translate("+(anc==="middle"?x-cx/2:anc==="end"?x-cx:x)+" "+y+")");return g}
function H2(num){return {n:num,d:[["2"]]}} // « … divisé par 2 », en fraction
function L(x1,y1,x2,y2,cls,op){return el("path",{d:"M"+x1+" "+y1+"L"+x2+" "+y2,"class":cls,opacity:op})}
function R(x,y,w,h,cls,op,style){return el("rect",{x:x,y:y,width:w,height:h,"class":cls,opacity:op,style:style})}
function poly(pts,cls,op){return el("path",{d:"M"+pts.map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1)}).join("L")+"Z","class":cls,opacity:op})}
/* Tourner des points autour d'un centre (en degrés) : les demi-tours qui montrent que deux morceaux sont pareils. */
function rot(pts,c,deg){var a=deg*Math.PI/180,co=Math.cos(a),si=Math.sin(a);
  return pts.map(function(p){var dx=p[0]-c[0],dy=p[1]-c[1];return [c[0]+dx*co-dy*si,c[1]+dx*si+dy*co]})}
function move(pts,dx,dy){return pts.map(function(p){return [p[0]+dx,p[1]+dy]})}
function head(x,y,dx,dy,cls){var n=Math.hypot(dx,dy),ux=dx/n,uy=dy/n,s=13;
  return el("path",{d:"M"+(x-ux*s-uy*s*.55)+" "+(y-uy*s+ux*s*.55)+"L"+x+" "+y+"L"+(x-ux*s+uy*s*.55)+" "+(y-uy*s-ux*s*.55),"class":cls})}
function arrow(x1,y1,x2,y2,p,cls){if(p<=0)return;var x=x1+(x2-x1)*p,y=y1+(y2-y1)*p;L(x1,y1,x,y,cls);head(x1,y1,x1-x2,y1-y2,cls);head(x,y,x2-x1,y2-y1,cls)}
/* Le petit carré de l'angle droit, au pied de la hauteur (sx : côté où on le dessine, +1 droite, -1 gauche). */
function droit(x,y,sx,op,s){s=s||18;el("path",{d:"M"+(x+sx*s)+" "+y+"L"+(x+sx*s)+" "+(y-s)+"L"+x+" "+(y-s),"class":"x sk",opacity:op})}
/* Un tracé qui se dessine le long de plusieurs points, avec le point rouge au bout. */
function trace(pts,p,cls,dot){var tot=0,i,seg=[];for(i=0;i<pts.length-1;i++){var l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(l);tot+=l}
  var left=tot*p,d="M"+pts[0][0]+" "+pts[0][1],tip=pts[0];
  for(i=0;i<seg.length&&left>0;i++){var f=Math.min(1,left/seg[i]);tip=[pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f];d+="L"+tip[0]+" "+tip[1];left-=seg[i]}
  el("path",{d:d,"class":cls});if(dot&&p>0&&p<1)el("circle",{cx:tip[0],cy:tip[1],r:7,"class":"dot"})}

/* Le rectangle de départ : 6 cm sur 4 cm (1 carreau = 1 cm = 50). */
var X=150,Y=200,U=50,W=6*U,H=4*U;
function grille(x,y,n,m,u,op){for(var i=1;i<n;i++)L(x+i*u,y,x+i*u,y+m*u,"th sm",op);for(i=1;i<m;i++)L(x,y+i*u,x+n*u,y+i*u,"th sm",op)}
function dhArrow(p,txt){if(p<=0)return;L(X,Y+H+12,X,Y+H+56,"th sm",p);L(X+W,Y+H+12,X+W,Y+H+56,"th sm",p);
  arrow(X,Y+H+40,X+W,Y+H+40,ease(p),"x sc");TS(X+W/2,Y+H+82,txt||[["dh","tc"],[" = 6 cm"]],"lbl",F(p,.6,1),"middle")}
function dvArrow(p,mot){if(p<=0)return;L(X-12,Y+H,X-56,Y+H,"th sm",p);L(X-12,Y,X-56,Y,"th sm",p);
  arrow(X-40,Y+H,X-40,Y,ease(p),"x sg");T(X-52,Y+H/2-4,mot||"dv","lbl tg",F(p,.6,1),"end");T(X-52,Y+H/2+28,"4 cm","lbl",F(p,.6,1),"end")}

/* Les triangles des démonstrations. */
var TR=[[X,Y+H],[X+W,Y+H],[X,Y]],                 // triangle rectangle : la moitié du rectangle
    HAUT=[[X,Y],[X+W,Y],[X+W,Y+H]],               // l'autre moitié
    CQ=[250,200],AQ=[150,400],BQ=[450,400],HQ=[250,400],   // triangle quelconque : base 6, hauteur 4
    AO=[100,400],BO=[300,400],CO=[400,200],HO=[400,400];   // hauteur à l'extérieur : base 4, hauteur 4

var STEPS=[
{chip:"Le périmètre",badge:"Périmètre",title:"Le périmètre du triangle : on fait le tour",
 text:"Le périmètre, c’est la longueur du tour. Pour un triangle, on additionne ses trois côtés. C’est une distance : on l’exprime en mm, cm, dm, m, dam, hm ou km.",
 acts:[[2800,"Voici un triangle. Son périmètre, c’est la longueur de son tour."],
       [2400,"On part d’un sommet et on suit le bord : 6 cm."],
       [2200,"On tourne : 4 cm."],
       [2400,"Et 5 cm pour revenir au départ."],
       [3600,"On additionne les trois côtés : 6 + 4 + 5 = 15. Le périmètre vaut 15 cm."]],
 draw:function(q){
  var A=[150,420],B=[450,420],C=[337.5,254.6],EX=560,o=q(0);
  poly([A,B,C],"x sm ds",F(o,0,.4));
  T(EX,110,"Périmètre du triangle","hd",F(o,.3,.7));T(EX,150,"On mesure une distance.","note",F(o,.5,1));
  var S=[[A,B,[300,458],"6 cm","middle"],[B,C,[420,322],"4 cm","start"],[C,A,[222,316],"5 cm","end"]],n=0;
  S.forEach(function(s,k){var v=q(k+1);if(v<=0)return;trace([s[0],s[1]],ease(Math.min(1,v/.75)),"pl sa",true);
    T(s[2][0],s[2][1],s[3],"lbl ta",F(v,.7,1),s[4]);if(v>=.75)n=k+1});
  if(n)T(EX,240,"P = "+[6,4,5].slice(0,n).join(" + "),"eq");
  var f=q(4);T(EX,300,"P = 15 cm","eq r",F(f,0,.4));T(EX,380,"On additionne","note",F(f,.3,.7));T(EX,415,"les 3 côtés.","note",F(f,.3,.7))}},

{chip:"La moitié du rectangle",badge:"Aire du triangle rectangle",title:"Le triangle, c’est la moitié du rectangle",
 text:"On part du rectangle : A = dh × dv = 6 × 4 = 24 cm². On le coupe par sa diagonale : on obtient deux triangles rectangles. En tournant l’un des deux, il recouvre exactement l’autre : ils sont identiques. Chaque triangle est donc la moitié du rectangle : on divise dh × dv par 2, ce qui donne 12 cm².",
 acts:[[3600,"On part du rectangle : dh × dv = 6 × 4 = 24 cm²."],
       [2800,"On le coupe en deux par sa diagonale : deux triangles rectangles."],
       [4200,"On fait tourner le triangle orange : il recouvre exactement le triangle bleu. Les deux sont identiques."],
       [3800,"Le triangle, c’est donc la moitié du rectangle : on divise par 2."],
       [3400,"6 × 4 = 24, divisé par 2 : 12 cm²."]],
 draw:function(q){

  R(X,Y,W,H,"fc",F(o,0,.5)*(1-F(d,0,.5)));grille(X,Y,6,4,U,.6*F(o,0,.5));R(X,Y,W,H,"pl sk",F(o,0,.3)*(1-.6*F(d,.5,1)));

    var hp=r>0?rot(HAUT,[X+W/2,Y+H/2],180*ease(r)):HAUT;

  FR(EX,465,[[["A = "]],H2([["6 × 4"]]),[[" = 12 cm²"]]],"eq r",F(q(4),0,.4))}},

{chip:"Base et hauteur",badge:"Les bons noms",title:"dh devient la base, dv devient la hauteur",
 text:"Pour le triangle, la distance horizontale s’appelle la base (b) et la distance verticale s’appelle la hauteur (h). La hauteur est toujours perpendiculaire à la base : elle fait un angle droit avec elle. La formule devient : base × hauteur, divisé par 2.",
 acts:[[3000,"Le triangle rectangle, avec sa distance horizontale et sa distance verticale."],

       [3400,"La distance verticale, c’est la hauteur. Elle fait un angle droit avec la base."],

 draw:function(q){

{chip:"Triangle quelconque",badge:"Tous les triangles",title:"Un triangle quelconque : toujours la moitié du rectangle",
 text:"On trace la hauteur : elle coupe le rectangle en deux petits rectangles. Dans chacun, le morceau orange (dehors) est identique au morceau bleu (dedans) : en le tournant, il le recouvre. Le triangle est donc encore la moitié du rectangle b × h : b × h divisé par 2, soit 6 × 4 divisé par 2 = 12 cm².",
 acts:[[3600,"Un autre triangle, avec la même base (6 cm) et la même hauteur (4 cm). La hauteur tombe à angle droit sur la base."],

  if(w.a!==shownAct){shownAct=w.a;$("gesture").textContent=s.acts[w.a][1]}
